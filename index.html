<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate Verification</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 650px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    overflow: hidden;
}

/* HEADER */

.header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

/* LOGO */

.logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: white;
    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    box-shadow: 0 3px 12px rgba(0,0,0,0.30);
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* TITLE */

.header h1 {
    font-size: 25px;
    letter-spacing: 1px;
}

.header p {
    margin-top: 8px;
    color: #d1d5db;
    font-size: 14px;
}

/* STATUS */

.status {
    text-align: center;
    padding: 25px 20px 10px;
}

.verified {
    display: inline-block;

    padding: 10px 22px;

    border-radius: 30px;

    background: #ecfdf5;

    color: #047857;

    font-weight: bold;

    border: 1px solid #a7f3d0;
}

/* CONTENT */

.content {
    padding: 25px 30px 35px;
}

.info {
    display: flex;
    justify-content: space-between;

    gap: 20px;

    padding: 15px 0;

    border-bottom: 1px solid #e5e7eb;
}

.label {
    color: #6b7280;
    font-size: 14px;
}

.value {
    font-weight: 600;
    color: #111827;
    text-align: right;
}

/* FOOTER */

.footer {
    text-align: center;

    padding: 18px;

    background: #f9fafb;

    color: #6b7280;

    font-size: 12px;
}

/* MOBILE */

@media(max-width:500px) {

    .content {
        padding: 20px;
    }

    .info {
        flex-direction: column;
        gap: 5px;
    }

    .value {
        text-align: left;
    }

    .logo {
        width: 95px;
        height: 95px;
    }

    .header h1 {
        font-size: 21px;
    }

}

</style>

</head>

<body>

<div class="card">

    <!-- HEADER -->

    <div class="header">

        <!-- IMAGE -->
        <div class="logo">
            <img src="IMI.jpg" alt="IMI Logo">
        </div>

        <h1>Certificate Verification</h1>

        <p>Official Certificate Verification System</p>

    </div>


    <!-- STATUS -->

    <div class="status">

        <span class="verified">
            ✓ CERTIFICATE VERIFIED
        </span>

    </div>


    <!-- INFORMATION -->

    <div class="content">

        <div class="info">

            <span class="label">
                Certificate Holder
            </span>

            <span class="value">
                Nom Prénom
            </span>

        </div>


        <div class="info">

            <span class="label">
                Certificate Title
            </span>

            <span class="value">
                Certificate of Achievement
            </span>

        </div>


        <div class="info">

            <span class="label">
                Certificate ID
            </span>

            <span class="value">
                CERT-2026-001
            </span>

        </div>


        <div class="info">

            <span class="label">
                Issue Date
            </span>

            <span class="value">
                18 September 2026
            </span>

        </div>


        <div class="info">

            <span class="label">
                Status
            </span>

            <span class="value">
                Valid
            </span>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        This certificate has been electronically verified.

    </div>

</div>

</body>

</html>
