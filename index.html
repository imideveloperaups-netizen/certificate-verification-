<!DOCTYPE html>
<html lang="fr">
<head>

<title>Certificate Verification | IMI Developer</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 650px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    overflow: hidden;
}

.header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: white;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.header h1 {
    font-size: 25px;
    letter-spacing: 1px;
}

.header p {
    margin-top: 8px;
    color: #d1d5db;
    font-size: 14px;
}

.status {
    text-align: center;
    padding: 25px 20px 10px;
}

.verified {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 30px;
    background: #ecfdf5;
    color: #047857;
    font-weight: bold;
    border: 1px solid #a7f3d0;
}

.invalid {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 30px;
    background: #fef2f2;
    color: #b91c1c;
    font-weight: bold;
    border: 1px solid #fecaca;
}

.content {
    padding: 25px 30px 35px;
}

.info {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 15px 0;
    border-bottom: 1px solid #e5e7eb;
}

.label {
    color: #6b7280;
    font-size: 14px;
}

.value {
    font-weight: 600;
    color: #111827;
    text-align: right;
}

.footer {
    text-align: center;
    padding: 18px;
    background: #f9fafb;
    color: #6b7280;
    font-size: 12px;
}

.verify-box {
    text-align: center;
    padding: 35px 30px;
}

.verify-box h2 {
    color: #111827;
    margin-bottom: 10px;
}

.verify-box p {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1f2937;
}

@media(max-width:500px) {

    .content {
        padding: 20px;
    }

    .info {
        flex-direction: column;
        gap: 5px;
    }

    .value {
        text-align: left;
    }

    .header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

</div>
